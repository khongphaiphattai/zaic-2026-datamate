repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --no-cache src/ tests/ scripts/audit_train_errors.py scripts/verify_holdout.py scripts/generate_public_submission.py scripts/compare_submissions.py scripts/run_container.py
        language: system
        pass_filenames: false
      - id: pytest-fast-guards
        name: pytest fast AST & contract guards
        entry: uv run python -m pytest -m "not slow" -q
        language: system
        pass_filenames: false
